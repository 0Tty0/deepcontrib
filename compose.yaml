services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deepcontrib
      POSTGRES_PASSWORD: deepcontrib
      POSTGRES_DB: deepcontrib
    ports:
      - "5432:5432"
    volumes:
      - deepcontrib-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepcontrib -d deepcontrib"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  deepcontrib-postgres:
