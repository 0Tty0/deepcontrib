[project]
name = "deepcontrib-backend"
version = "0.1.0"
description = "A small, durable Deep Agents workspace for open-source contributions."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "deepagents==0.7.13",
    "fastapi>=0.116,<1",
    "langchain-openai>=1.1,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "typer>=0.16,<1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[project.scripts]
deepcontrib = "deepcontrib.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepcontrib"]
include = ["src/deepcontrib/skills/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "integration: requires installed runtime integrations or local services",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["deepcontrib"]
